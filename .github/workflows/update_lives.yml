name: Update Chinese Live Sources

on:
  schedule:
    - cron: "0 18 * * *"   # ~02:00 Beijing time
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run update script
        run: |
          python scripts/update_lives.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lives/ tvbox.json
          git diff --staged --quiet || git commit -m "Auto update Chinese live sources $(date -u +%Y-%m-%d)"
          git push

      - name: Check email secrets
        run: |
          if [ -z "${{ secrets.QQ_EMAIL }}" ]; then
            echo "ERROR: Secret QQ_EMAIL is empty. Add it in Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "${{ secrets.QQ_AUTH_CODE }}" ]; then
            echo "ERROR: Secret QQ_AUTH_CODE is empty."
            exit 1
          fi
          echo "Secrets look present (values hidden)."

      - name: Send email with chinese.m3u attachment
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_AUTH_CODE }}
          subject: Ryukyou IPTV chinese.m3u 每日更新
          to: ${{ secrets.QQ_EMAIL }}
          from: Ryukyou IPTV <${{ secrets.QQ_EMAIL }}>
          body: |
            Ryukyou IPTV 每日更新
            附件为最新 chinese.m3u 全文。
            仓库地址: https://github.com/RyuKyou/personal-iptv-config
          attachments: lives/chinese.m3u
