name: Update Chinese Live Sources

on:
  schedule:
    - cron: "0 18 * * *"   # 02:00 Beijing time roughly
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run update script
        run: |
          python scripts/update_lives.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lives/ tvbox.json
          git diff --staged --quiet || git commit -m "Auto update Chinese live sources $(date -u +%Y-%m-%d)"
          git push
